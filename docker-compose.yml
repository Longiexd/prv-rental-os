# Local Linux/WSL development. Initialize the separate development registry first.
name: klynx-rental-os-development
services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./runtime/frontend.env
    environment:
      NODE_ENV: development
      APP_ENV: development
      APP_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://backend:8000
      WATCHPACK_POLLING: "true"
    networks: [development]
  backend:
    build:
      context: ./backend
    container_name: klynx-rental-api-development
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost:3100
      KLYNX_STATE_DIR: /var/lib/klynx/control
      KLYNX_SESSION_KEY_FILE: /run/klynx/session.key
      KLYNX_PROXY_KEY_FILE: /run/klynx/proxy.key
    volumes:
      - /var/lib/klynx/development/control:/var/lib/klynx/control
      - /etc/klynx/development:/run/klynx:ro
    networks: [development]
networks:
  development:
    name: klynx-api-development
