services:

 
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: klynx-rental-frontend
    ports:
      - "3100:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WATCHPACK_POLLING: "true"
    networks:
      - odoo-net


  backend:
    build:
      context: ./backend
    container_name: klynx-rental-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    networks:
      - odoo-net


networks:

  odoo-net:
    external: true
    name: odoo-docker_odoo-net