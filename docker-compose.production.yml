services:
  backend-production:
    build:
      context: ./backend
    container_name: klynx-rental-api-production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env.production
    networks:
      - odoo-production
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  odoo-production:
    external: true
    name: ${ODOO_PRODUCTION_DOCKER_NETWORK:-klynx-odoo-production}
