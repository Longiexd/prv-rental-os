services:
  backend-production:
    build:
      context: ./backend
    container_name: klynx-rental-api-production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./runtime/backend.env
    environment:
      APP_ENV: production
      KLYNX_STATE_DIR: /var/lib/klynx/control
      KLYNX_SESSION_KEY_FILE: /run/klynx/session.key
      KLYNX_PROXY_KEY_FILE: /run/klynx/proxy.key
    volumes:
      - /var/lib/klynx/production/control:/var/lib/klynx/control
      - /etc/klynx/production:/run/klynx:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1
    pids_limit: 256
    networks:
      - api-production
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  api-production:
    name: klynx-api-production
