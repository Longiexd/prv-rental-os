name: Promote tested commit to production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional rollback SHA. Leave blank to promote the current main release candidate."
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve staged release
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require main and select a commit present in both branches
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          git fetch origin \
            main:refs/remotes/origin/main \
            staging:refs/remotes/origin/staging

          if [[ -n "$REQUESTED_SHA" ]]; then
            candidate="$(git rev-parse "$REQUESTED_SHA^{commit}")"
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/staging; then
            candidate="$GITHUB_SHA"
          elif [[ "$(git rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)" -eq 3 ]]; then
            candidate="$(git rev-parse "$GITHUB_SHA^2")"
          else
            echo "main must be fast-forwarded from staging or merged from staging with a merge commit" >&2
            exit 1
          fi

          git merge-base --is-ancestor "$candidate" origin/staging
          git merge-base --is-ancestor "$candidate" origin/main
          successful_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs?head_sha=$candidate&branch=staging&event=push&status=success&per_page=1" --jq '.total_count')"
          test "$successful_runs" -gt 0 || { echo "No successful staging deployment for this commit" >&2; exit 1; }
          echo "release_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Promoting staged commit $candidate"

  deploy:
    name: Approve and deploy production
    needs: resolve-release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rental-os.klynx.net
    env:
      CLOUDFLARE_ENV: production
      RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VPS_SSH_HOST: ${{ vars.VPS_SSH_HOST }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Guard environment wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "${{ vars.PRODUCTION_DEPLOY_READY }}" = "true"
          test "$NEXT_PUBLIC_API_URL" = "https://api.rental-os.klynx.net"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Re-run backend tests on the promoted commit
        env:
          CORS_ALLOWED_ORIGINS: https://rental-os.klynx.net
        run: |
          python -m pip install -r backend/requirements.txt pytest
          python -m pytest -q backend

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build:vinext

      - name: Verify generated Worker isolation
        run: |
          node --test deploy/verify-worker.test.mjs
          node deploy/verify-worker.mjs production

      - name: Create production release
        shell: bash
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          set -Eeuo pipefail
          test -n "$BACKEND_ENV"
          git archive --format=tar.gz --output="${RUNNER_TEMP}/klynx-${RELEASE_SHA}.tar.gz" "${RELEASE_SHA}"
          umask 077
          printf '%s\n' "$BACKEND_ENV" > "${RUNNER_TEMP}/backend-runtime.env"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.VPS_SSH_HOST }}

      - name: Deploy production backend
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          port="${VPS_SSH_PORT:-22}"
          remote="${VPS_SSH_USER}@${VPS_SSH_HOST}"
          prefix="/tmp/klynx-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp -P "$port" "${RUNNER_TEMP}/klynx-${RELEASE_SHA}.tar.gz" "$remote:$prefix.tar.gz"
          scp -p -P "$port" "${RUNNER_TEMP}/backend-runtime.env" "$remote:$prefix.env"
          ssh -p "$port" "$remote" "sudo /usr/local/sbin/klynx-install-release production '$RELEASE_SHA' '$prefix.tar.gz' '$prefix.env' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Deploy production Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config dist/server/wrangler.json

      - name: Clean runner deployment credentials
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/backend-runtime.env" ~/.ssh/id_ed25519
