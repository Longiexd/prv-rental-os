name: Deploy staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  tenant-integration:
    uses: ./.github/workflows/tenant-integration.yml
  deploy:
    needs: tenant-integration
    name: Test and deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.rental-os.klynx.net
    env:
      CLOUDFLARE_ENV: staging
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VPS_SSH_HOST: ${{ vars.VPS_SSH_HOST }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard environment wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = "refs/heads/staging"
          test "$NEXT_PUBLIC_API_URL" = "https://api-staging.rental-os.klynx.net"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run backend tests
        env:
          CORS_ALLOWED_ORIGINS: https://staging.rental-os.klynx.net
        run: |
          python -m pip install -r backend/requirements.txt pytest httpx
          python -m pytest -q backend

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend once
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          node --test lib/proxy-security.test.mjs
          npm run build:vinext

      - name: Verify generated Worker isolation
        run: |
          node --test deploy/verify-worker.test.mjs
          node deploy/verify-worker.mjs staging
          python deploy/test_frontend_proxy.py

      - name: Create backend release
        shell: bash
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          set -Eeuo pipefail
          test -n "$BACKEND_ENV"
          git archive --format=tar.gz --output="${RUNNER_TEMP}/klynx-${GITHUB_SHA}.tar.gz" "${GITHUB_SHA}"
          umask 077
          printf '%s\n' "$BACKEND_ENV" > "${RUNNER_TEMP}/backend-runtime.env"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.VPS_SSH_HOST }}


      - name: Deploy staging backend
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          port="${VPS_SSH_PORT:-22}"
          remote="${VPS_SSH_USER}@${VPS_SSH_HOST}"
          prefix="/tmp/klynx-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp -P "$port" "${RUNNER_TEMP}/klynx-${GITHUB_SHA}.tar.gz" "$remote:$prefix.tar.gz"
          scp -p -P "$port" "${RUNNER_TEMP}/backend-runtime.env" "$remote:$prefix.env"
          ssh -p "$port" "$remote" "sudo /usr/local/sbin/klynx-install-release staging '$GITHUB_SHA' '$prefix.tar.gz' '$prefix.env' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Deploy staging Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler deploy --config dist/server/wrangler.json

      - name: Clean runner deployment credentials
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/backend-runtime.env" ~/.ssh/id_ed25519
