name: Deploy staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.rental-os.klynx.net
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VPS_SSH_HOST: ${{ vars.VPS_SSH_HOST }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
      VPS_SSH_USER: ${{ vars.VPS_SSH_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard environment wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$NEXT_PUBLIC_API_URL" = "https://api-staging.rental-os.klynx.net"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$BACKEND_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Run backend tests
        env:
          CORS_ALLOWED_ORIGINS: https://staging.rental-os.klynx.net
        run: |
          python -m pip install -r backend/requirements.txt pytest
          python -m pytest -q backend

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend once
        working-directory: frontend
        run: |
          npm ci
          npm run build:vinext

      - name: Create backend release
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=frontend/node_modules --exclude=frontend/dist --exclude=frontend/.next -czf "${RUNNER_TEMP}/klynx-${GITHUB_SHA}.tar.gz" .
          umask 077
          printf '%s\n' "$BACKEND_ENV" > backend-runtime.env

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.VPS_SSH_HOST }}


      - name: Deploy staging backend
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          port="${VPS_SSH_PORT:-22}"
          remote="${VPS_SSH_USER}@${VPS_SSH_HOST}"
          prefix="/tmp/klynx-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp -P "$port" "${RUNNER_TEMP}/klynx-${GITHUB_SHA}.tar.gz" "$remote:$prefix.tar.gz"
          scp -P "$port" backend-runtime.env "$remote:$prefix.env"
          ssh -p "$port" "$remote" "sudo /usr/local/sbin/klynx-install-release staging '$GITHUB_SHA' '$prefix.tar.gz' '$prefix.env' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Deploy staging Worker
        working-directory: frontend
        run: npx vinext-cloudflare deploy --env staging --skip-build
