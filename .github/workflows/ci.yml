name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CORS_ALLOWED_ORIGINS: http://localhost:3100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q

  frontend-build:
    name: Frontend vinext build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test lib/proxy-security.test.mjs lib/fleet-bookings.test.mjs ../deploy/verify-worker.test.mjs
      - run: npm run build:vinext
      - run: python ../deploy/test_frontend_proxy.py
